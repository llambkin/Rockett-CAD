name: rockett-cad

# One file, many instances: pick the instance with `-p` and the environment.
#   ROCKETT_BIND       host address to publish on (default 127.0.0.1; the app has no auth)
#   ROCKETT_HOST_PORT  host port (default 8788)
#   ROCKETT_TAG        image tag (default local)
#   ROCKETT_MEM_LIMIT  container memory cap (default 6g)
#   ROCKETT_COMMIT     git revision baked into the image and /api/health
#   ROCKETT_DESCRIBE   git describe output baked into the image and /api/health
services:
  rockett-cad:
    build:
      context: .
      args:
        ROCKETT_COMMIT: ${ROCKETT_COMMIT:-}
        ROCKETT_DESCRIBE: ${ROCKETT_DESCRIBE:-}
    image: rockett-cad:${ROCKETT_TAG:-local}
    restart: unless-stopped
    ports:
      - "${ROCKETT_BIND:-127.0.0.1}:${ROCKETT_HOST_PORT:-8788}:8788"
    mem_limit: ${ROCKETT_MEM_LIMIT:-6g}
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    volumes:
      # All persistent state: project documents, reference images, exports.
      - data:/data

volumes:
  data:
